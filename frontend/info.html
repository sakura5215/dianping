<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">

  <style type="text/css">
      .el-tabs--bottom .el-tabs__item.is-bottom:nth-child(2), .el-tabs--bottom .el-tabs__item.is-top:nth-child(2), .el-tabs--top .el-tabs__item.is-bottom:nth-child(2), .el-tabs--top .el-tabs__item.is-top:nth-child(2) {
          padding-left: 15px;
      }

      .el-tabs, .el-tab-pane {
          height: 100%;
      }

      .el-tabs__header {
          height: 10%;
      }

      .el-tabs__content {
          height: 90%;
      }

      .user-list {
          padding: 10px 15px;
          overflow-y: auto;
          height: 100%;
          box-sizing: border-box;
      }

      .user-item {
          display: flex;
          align-items: center;
          padding: 10px 0;
          border-bottom: 1px solid #f0f0f0;
          cursor: pointer;
      }

      .user-item:last-child {
          border-bottom: none;
      }

      .user-item img {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          object-fit: cover;
          margin-right: 12px;
      }

      .user-item .user-name {
          font-size: 15px;
          color: #333;
      }

      .empty-tip {
          text-align: center;
          color: #999;
          font-size: 14px;
          padding: 40px 0;
      }
  </style>

</head>

<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">个人主页&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="basic">
    <div class="basic-icon">
      <img :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
    </div>
    <div class="basic-info">
      <div class="name">{{user.nickName}}</div>
      <span>杭州</span>
      <div class="edit-btn" @click="toEdit">
        编辑资料
      </div>
    </div>
    <div class="logout-btn" @click="logout">
      退出登录
    </div>
  </div>
  <div class="introduce">
    <span v-if="info.introduce"></span>
    <span v-else>添加个人简介，让大家更好的认识你 <i class="el-icon-edit"></i></span>
  </div>
  <div class="content">
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <div v-if="blogs.length === 0" class="empty-tip">还没有发布过笔记</div>
        <div v-for="b in blogs" :key="b.id" class="blog-item">
          <div class="blog-img"><img :src="b.images.split(',')[0]" alt=""></div>
          <div class="blog-info">
            <div class="blog-title">{{b.title}}</div>
            <div class="blog-liked"><img src="/imgs/thumbup.png" alt=""> {{b.liked}}</div>
            <div class="blog-comments"><i class="el-icon-chat-dot-round"></i> {{b.comments}}</div>
          </div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="评价" name="2">
        <div class="empty-tip">暂无评价</div>
      </el-tab-pane>
      <el-tab-pane :label="'粉丝(' + fanCount + ')'" name="3">
        <div class="user-list">
          <div v-if="fans.length === 0" class="empty-tip">还没有粉丝</div>
          <div class="user-item" v-for="u in fans" :key="u.id" @click="toUser(u.id)">
            <img :src="u.icon || '/imgs/icons/default-icon.png'" alt="">
            <div class="user-name">{{u.nickName}}</div>
          </div>
        </div>
      </el-tab-pane>
      <el-tab-pane :label="'关注(' + followCount + ')'" name="4">
        <div class="user-list">
          <div v-if="follows.length === 0" class="empty-tip">还没有关注的人</div>
          <div class="user-item" v-for="u in follows" :key="u.id" @click="toUser(u.id)">
            <img :src="u.icon || '/imgs/icons/default-icon.png'" alt="">
            <div class="user-name">{{u.nickName}}</div>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      user: "",
      activeName: "1",
      info: {},
      blogs: [],
      fans: [],      // 粉丝列表
      follows: [],   // 关注列表
      fanCount: 0,
      followCount: 0,
      statLoaded: false, // 统计是否已查过（关注/取关回来时刷新）
    },
    created() {
      this.queryUser();
    },
    methods: {
      queryBlogs() {
        axios.get("/blog/of/me")
          .then(({data}) => this.blogs = data)
          .catch(this.$message.error)
      },
      queryFollowStat() {
        axios.get("/follow/count/" + this.user.id)
          .then(({data}) => {
            this.fanCount = data.fanCount || 0;
            this.followCount = data.followCount || 0;
            this.statLoaded = true;
          })
          .catch(err => console.log(err))
      },
      queryFans() {
        axios.get("/follow/list/fan/" + this.user.id)
          .then(({data}) => this.fans = data)
          .catch(err => console.log(err))
      },
      queryFollows() {
        axios.get("/follow/list/of/" + this.user.id)
          .then(({data}) => this.follows = data)
          .catch(err => console.log(err))
      },
      queryUser() {
        // 查询用户信息
        axios.get("/user/me")
          .then(({data}) => {
            // 保存用户
            this.user = data;
            // 查询用户详情
            this.queryUserInfo();
            // 查询用户笔记
            this.queryBlogs();
            // 查询粉丝/关注统计
            this.queryFollowStat();
          })
          .catch(err => {
            location.href = "login.html"
          })
      },
      goBack() {
        history.back();
      },
      queryUserInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return
            }
            // 保存用户详情
            this.info = data;
            // 保存到本地
            sessionStorage.setItem("userInfo", JSON.stringify(data))
          })
          .catch(err => {
            this.$message.error(err);
          })
      },
      toEdit() {
        location.href = 'info-edit.html'
      },
      toUser(id) {
        location.href = 'other-info.html?id=' + id
      },
      logout() {
        axios.post("/user/logout")
          .then(() => {
            // 清理session
            sessionStorage.removeItem("token")
            // 跳转
            location.href = "/"
          })
          .catch(this.$message.error)
      },
      handleClick(r) {
        if (r.name === '3') {
          this.queryFans();
        } else if (r.name === '4') {
          this.queryFollows();
        }
      },
    },

  })
</script>
</body>

</html>
