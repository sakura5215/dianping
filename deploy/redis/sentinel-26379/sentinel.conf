# Redis Sentinel 配置（26379）
port 26379
bind 127.0.0.1
protected-mode yes
dir "D:\\BaiduNetdiskDownload\\heima-dianping\\hm-dianping\\deploy\\redis\\sentinel-26379"
logfile "sentinel-26379.log"
# 监控主节点：名称 mymaster，IP 端口，quorum（法定票数）
sentinel myid 196928b36cf168472b89fea999a63dd186b2163b
# 主节点无响应多少毫秒后判定主观下线
sentinel monitor mymaster 127.0.0.1 6380 2
# 故障转移超时
sentinel down-after-milliseconds mymaster 5000
# 一次最多同步几个从节点
sentinel failover-timeout mymaster 10000
# Generated by CONFIG REWRITE
sentinel config-epoch mymaster 1
sentinel leader-epoch mymaster 1
sentinel known-slave mymaster 127.0.0.1 6379
sentinel known-slave mymaster 127.0.0.1 6381
sentinel known-sentinel mymaster 127.0.0.1 26381 935fa51c3c426d0c07faeb5a4d948be21fd80181
sentinel known-sentinel mymaster 127.0.0.1 26380 2ced6cbf6e4adc7bde26de21da04676d90d67588
sentinel current-epoch 1
