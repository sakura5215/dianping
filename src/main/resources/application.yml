server:
  port: 8081
spring:
  application:
    name: dianping
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dianping}?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      # 单机模式（默认）：localhost:6379
      # 高可用模式：激活 sentinel profile（--spring.profiles.active=sentinel），
      # 哨兵节点配在 application-sentinel.yml，自动发现主节点
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.dianping.entity
logging:
  level:
    com.dianping: debug
# 自定义业务配置
dianping:
  upload:
    path: ${DIANPING_UPLOAD_PATH:./uploads}
  # Canal binlog 订阅（缓存一致性）
  canal:
    enabled: ${DIANPING_CANAL_ENABLED:true}
    host: ${CANAL_HOST:localhost}
    port: ${CANAL_PORT:11111}